<main class="w-full max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-grow">
    <!-- Breadcrumb & Top Page Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
            <!-- Breadcrumbs -->
            <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mb-1.5">
                <button @click="navigate('')" class="hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    <span>Daftar Timesheet</span>
                </button>
                <span>/</span>
                <span class="text-gray-800 dark:text-gray-200 font-medium">Edit Timesheet</span>
            </div>
            
            <div class="flex items-center gap-3">
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">Edit Timesheet</h1>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-mono font-semibold bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200 border border-amber-200 dark:border-amber-700">
                    ID: <span x-text="editForm.id || currentRoute.id"></span>
                </span>
            </div>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">
                Ubah informasi catatan timesheet yang telah ada.
            </p>
        </div>

        <!-- Back Button -->
        <button @click="navigate('')" type="button" :disabled="isSubmittingEdit"
            class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition cursor-pointer disabled:opacity-50">
            &larr; Kembali ke List
        </button>
    </div>

    <!-- Loading State Skeleton -->
    <div x-show="isLoadingEdit" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-8 text-center animate-pulse">
        <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center mx-auto mb-3">
            <svg class="w-6 h-6 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
        </div>
        <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Memuat data timesheet...</p>
    </div>

    <!-- Edit Form Card -->
    <div x-show="!isLoadingEdit" class="relative bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-200">
        
        <div class="p-6 sm:p-8 space-y-6">
            
            <!-- Row 1: Date, Start Time, End Time -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Date -->
                <div>
                    <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                        Tanggal <span class="text-red-500">*</span>
                    </label>
                    <input type="date" x-model="editForm.date" 
                        class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <!-- Start Time -->
                <div>
                    <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                        Waktu Mulai <span class="text-red-500">*</span>
                    </label>
                    <input type="time" x-model="editForm.begin" 
                        class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <!-- End Time -->
                <div>
                    <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                        Waktu Selesai <span class="text-red-500">*</span>
                    </label>
                    <input type="time" x-model="editForm.end" 
                        class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <!-- Row 2: Customer, Project, Activity -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Customer Dropdown (Searchable) -->
                <div x-data="searchSelect()" @click.away="close()" class="relative" :class="open ? 'z-30' : 'z-10'">
                    <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                        Customer
                    </label>
                    <div @click="toggle()" 
                        class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm rounded-lg w-full p-2.5 flex justify-between items-center cursor-pointer transition focus-within:ring-2 focus-within:ring-blue-500">
                        <span class="truncate" x-text="getSelectedName(customers, editForm.customer, 'Pilih Customer...')" 
                            :class="isSelected(editForm.customer) ? 'text-gray-900 dark:text-white' : 'text-gray-400 dark:text-gray-400'"></span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    
                    <!-- Dropdown Menu -->
                    <div x-show="open" x-cloak x-transition class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-hidden">
                        <div class="p-2 border-b border-gray-200 dark:border-gray-600">
                            <input x-ref="searchInput" type="text" x-model="search" placeholder="Cari customer..."
                                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <ul class="max-h-48 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600">
                            <li @click="editForm.customer = ''; close()" class="px-3.5 py-2 hover:bg-gray-100 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-500 dark:text-gray-400 italic">
                                (Kosongkan pilihan)
                            </li>
                            <template x-for="item in filterList(customers)" :key="item.id">
                                <li @click="editForm.customer = item.id; close()" 
                                    class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors"
                                    :class="String(editForm.customer) === String(item.id) ? 'font-bold bg-blue-50/50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300' : ''"
                                    x-text="item.name"></li>
                            </template>
                            <li x-show="filterList(customers).length === 0" class="px-4 py-3 text-xs text-gray-400 text-center">
                                Tidak ditemukan
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Project Dropdown (Searchable) -->
                <div x-data="searchSelect()" @click.away="close()" class="relative" :class="open ? 'z-30' : 'z-10'">
                    <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                        Project <span class="text-red-500">*</span>
                    </label>
                    <div @click="toggle()" 
                        class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm rounded-lg w-full p-2.5 flex justify-between items-center cursor-pointer transition focus-within:ring-2 focus-within:ring-blue-500">
                        <span class="truncate" x-text="getSelectedName(projects, editForm.project, 'Pilih Project...')" 
                            :class="isSelected(editForm.project) ? 'text-gray-900 dark:text-white font-medium' : 'text-gray-400 dark:text-gray-400'"></span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    
                    <!-- Dropdown Menu -->
                    <div x-show="open" x-cloak x-transition class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-hidden">
                        <div class="p-2 border-b border-gray-200 dark:border-gray-600">
                            <input x-ref="searchInput" type="text" x-model="search" placeholder="Cari project..."
                                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <ul class="max-h-48 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600">
                            <template x-for="item in filterList(projects)" :key="item.id">
                                <li @click="editForm.project = item.id; close()" 
                                    class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors"
                                    :class="String(editForm.project) === String(item.id) ? 'font-bold bg-blue-50/50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300' : ''"
                                    x-text="item.name"></li>
                            </template>
                            <li x-show="filterList(projects).length === 0" class="px-4 py-3 text-xs text-gray-400 text-center">
                                Tidak ditemukan
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Activity Dropdown (Searchable) -->
                <div x-data="searchSelect()" @click.away="close()" class="relative" :class="open ? 'z-30' : 'z-10'">
                    <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                        Activity <span class="text-red-500">*</span>
                    </label>
                    <div @click="toggle()" 
                        class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm rounded-lg w-full p-2.5 flex justify-between items-center cursor-pointer transition focus-within:ring-2 focus-within:ring-blue-500">
                        <span class="truncate" x-text="getSelectedName(activities, editForm.activity, 'Pilih Activity...')" 
                            :class="isSelected(editForm.activity) ? 'text-gray-900 dark:text-white font-medium' : 'text-gray-400 dark:text-gray-400'"></span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </div>
                    
                    <!-- Dropdown Menu -->
                    <div x-show="open" x-cloak x-transition class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-hidden">
                        <div class="p-2 border-b border-gray-200 dark:border-gray-600">
                            <input x-ref="searchInput" type="text" x-model="search" placeholder="Cari activity..."
                                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <ul class="max-h-48 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600">
                            <template x-for="item in filterList(activities)" :key="item.id">
                                <li @click="editForm.activity = item.id; close()" 
                                    class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors"
                                    :class="String(editForm.activity) === String(item.id) ? 'font-bold bg-blue-50/50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300' : ''"
                                    x-text="item.name"></li>
                            </template>
                            <li x-show="filterList(activities).length === 0" class="px-4 py-3 text-xs text-gray-400 text-center">
                                Tidak ditemukan
                            </li>
                        </ul>
                    </div>
                </div>

            </div>

            <!-- Row 3: Description -->
            <div>
                <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                    Description <span class="text-red-500">*</span>
                </label>
                <textarea x-model="editForm.description" rows="3" 
                    class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" 
                    placeholder="Tuliskan deskripsi pekerjaan..."></textarea>
            </div>

            <!-- Row 4: Tags Input -->
            <div x-data="tagInput()" @click.away="open = false" class="relative" :class="open ? 'z-30' : 'z-10'">
                <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                    Tags
                </label>
                <div @click="open = true; $nextTick(() => $refs.tagSearchInput?.focus())" 
                    class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg w-full p-1.5 min-h-[42px] flex flex-wrap gap-1.5 items-center cursor-text transition focus-within:ring-2 focus-within:ring-blue-500">
                    
                    <!-- Selected Tags Chips -->
                    <template x-for="tag in editForm.tags" :key="tag">
                        <span class="bg-blue-50 dark:bg-blue-900/60 text-blue-700 dark:text-blue-200 text-xs font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 border border-blue-200 dark:border-blue-700">
                            <span x-text="tag"></span>
                            <button type="button" @click.stop="removeTag(editForm.tags, tag)" class="hover:text-red-600 dark:hover:text-red-400 focus:outline-none">&times;</button>
                        </span>
                    </template>
                    
                    <!-- Search Input -->
                    <input x-ref="tagSearchInput" type="text" x-model="search" 
                        @keydown="handleKeydown($event, editForm.tags, availableTags)" 
                        @focus="open = true" 
                        class="bg-transparent border-none outline-none text-xs text-gray-900 dark:text-white flex-grow min-w-[70px] p-1 focus:ring-0" 
                        placeholder="Ketik tag lalu tekan enter...">
                </div>

                <!-- Tags Autocomplete Dropdown -->
                <div x-show="open && (getFilteredTags(availableTags, editForm.tags).length > 0 || search.trim() !== '')" 
                    x-cloak x-transition 
                    class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-y-auto max-h-48 divide-y divide-gray-100 dark:divide-gray-600">
                    <ul>
                        <template x-for="item in getFilteredTags(availableTags, editForm.tags)" :key="item">
                            <li @click="addTag(editForm.tags, item)" 
                                class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors" 
                                x-text="item"></li>
                        </template>
                        <li x-show="getFilteredTags(availableTags, editForm.tags).length === 0 && search.trim() !== ''" 
                            @click="addTag(editForm.tags, search.trim())" 
                            class="px-3.5 py-2 hover:bg-emerald-50 dark:hover:bg-emerald-700 cursor-pointer text-xs text-emerald-700 dark:text-emerald-200 font-medium">
                            + Tambahkan tag baru: "<span x-text="search"></span>"
                        </li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- Card Footer Action Buttons -->
        <div class="px-6 py-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 flex justify-end items-center gap-3 rounded-b-xl">
            <button @click="navigate('')" type="button" :disabled="isSubmittingEdit"
                class="px-5 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition cursor-pointer disabled:opacity-50">
                Batal
            </button>
            <button @click="submitEditForm" type="button" :disabled="isSubmittingEdit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-6 py-2.5 transition shadow-sm flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                <template x-if="isSubmittingEdit">
                    <svg class="w-4 h-4 animate-spin text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </template>
                <span x-text="isSubmittingEdit ? 'Menyimpan...' : 'Simpan Perubahan'"></span>
            </button>
        </div>

    </div>
</main>
