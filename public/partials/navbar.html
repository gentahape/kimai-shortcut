<nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-md">
    <div class="text-xl font-bold tracking-wide text-white">
        Kimai Shortcut
    </div>
    
    <div>
        <div x-cloak x-show="!isAuthenticated" class="flex items-center space-x-3">
            <input type="text" x-model="token" @keydown.enter="login" placeholder="Token" 
                class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block px-3 py-2 placeholder-gray-400"
                autocomplete="off" :disabled="isLoading">
            
            <button @click="login" :disabled="isLoading" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-5 py-2 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                <span x-text="isLoading ? 'Loading...' : 'SignIn'"></span>
            </button>
        </div>
        <div x-cloak x-show="isAuthenticated" class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-full text-white flex items-center justify-center font-bold text-lg border-2 border-gray-600 shadow-sm overflow-hidden" 
                 :style="`background-color: ${user['color-safe'] || '#4F46E5'}`">
                <template x-if="user.avatar">
                    <img :src="user.avatar" alt="Avatar" class="w-full h-full object-cover">
                </template>
                <template x-if="!user.avatar">
                    <span x-text="user.initials"></span>
                </template>
            </div>
            <div class="flex flex-col text-left">
                <span class="text-sm font-semibold text-white" x-text="user.alias || user.username"></span>
                <span class="text-xs text-gray-400" x-text="user.title"></span>
            </div>
            <button @click="logout" title="Keluar" class="ml-2 text-gray-400 hover:text-red-500 transition cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>
    </div>
</nav>
