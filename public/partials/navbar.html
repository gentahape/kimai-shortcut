<nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 sm:px-6 py-3.5 flex justify-between items-center shadow-xs transition-colors duration-200">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
        <a href="#/" class="flex items-center gap-2.5 text-gray-900 dark:text-white font-bold text-lg sm:text-xl tracking-tight hover:opacity-90 transition">
            <div class="w-9 h-9 rounded-lg bg-blue-600 dark:bg-blue-500 text-white flex items-center justify-center shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <span>Kimai <span class="text-blue-600 dark:text-blue-400 font-extrabold">Shortcut</span></span>
        </a>

        <!-- Current View Pill -->
        <span x-cloak x-show="isAuthenticated && currentRoute.view !== 'list'" class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600">
            <template x-if="currentRoute.view === 'add'">
                <span>Add Timesheets</span>
            </template>
            <template x-if="currentRoute.view === 'edit'">
                <span>Edit Timesheet</span>
            </template>
        </span>
    </div>

    <!-- Right Controls: Theme Toggle, Auth, Profile -->
    <div class="flex items-center gap-2 sm:gap-3">
        <!-- Theme Toggle Button -->
        <button @click="toggleTheme" type="button" :title="theme === 'dark' ? 'Ganti ke Light Mode' : 'Ganti ke Dark Mode'"
            class="p-2 rounded-lg text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
            <template x-if="theme === 'dark'">
                <!-- Sun Icon -->
                <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </template>
            <template x-if="theme !== 'dark'">
                <!-- Moon Icon -->
                <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </template>
        </button>

        <!-- Unauthenticated Form -->
        <div x-cloak x-show="!isAuthenticated" class="flex items-center gap-2">
            <input type="text" x-model="token" @keydown.enter="login" placeholder="Masukkan API Bearer Token..."
                class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block px-3 py-1.5 placeholder-gray-400 w-44 sm:w-64 outline-none transition"
                autocomplete="off" :disabled="isLoadingAuth">

            <button @click="login" :disabled="isLoadingAuth"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-4 py-1.5 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1.5 shadow-sm">
                <span x-text="isLoadingAuth ? 'Signing in...' : 'Sign In'"></span>
            </button>
        </div>

        <!-- Authenticated Profile & Logout -->
        <div x-cloak x-show="isAuthenticated" class="flex items-center gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-sm border-2 border-gray-200 dark:border-gray-600 shadow-xs overflow-hidden"
                    :style="`background-color: ${user['color-safe'] || '#4F46E5'}`">
                    <template x-if="user.avatar">
                        <img :src="user.avatar" alt="Avatar" class="w-full h-full object-cover">
                    </template>
                    <template x-if="!user.avatar">
                        <span x-text="user.initials || 'U'"></span>
                    </template>
                </div>
                <div class="hidden md:flex flex-col text-left">
                    <span class="text-sm font-semibold text-gray-800 dark:text-gray-100" x-text="user.alias || user.username"></span>
                    <span class="text-xs text-gray-500 dark:text-gray-400" x-text="user.title || 'User'"></span>
                </div>
            </div>

            <button @click="logout" title="Sign Out"
                class="p-2 rounded-lg text-gray-500 hover:text-red-600 dark:text-gray-400 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </button>
        </div>
    </div>
</nav>
