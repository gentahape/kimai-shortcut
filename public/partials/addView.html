<main class="w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8 pb-20 flex-grow">
    <!-- Breadcrumb & Top Page Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
            <!-- Breadcrumbs -->
            <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mb-1.5">
                <button @click="navigate('')" class="hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    <span>Daftar Timesheet</span>
                </button>
                <span>/</span>
                <span class="text-gray-800 dark:text-gray-200 font-medium">Tambah Entri Baru</span>
            </div>
            
            <div class="flex items-center gap-3">
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white">Tambah Timesheet</h1>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-200 border border-blue-200 dark:border-blue-700">
                    <span x-text="addForms.length"></span> Form
                </span>
            </div>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">
                Anda dapat mengisi beberapa timesheet sekaligus dalam satu kali pengiriman.
            </p>
        </div>

        <!-- Top Actions -->
        <div class="flex items-center gap-2.5 self-end sm:self-auto">
            <button @click="navigate('')" type="button" :disabled="isSubmittingAdd"
                class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition cursor-pointer disabled:opacity-50">
                Batal
            </button>
            <button @click="addAnotherForm" type="button" :disabled="isSubmittingAdd"
                class="px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 text-sm font-medium transition flex items-center gap-1.5 cursor-pointer disabled:opacity-50">
                <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                <span>+ Tambah Form</span>
            </button>
        </div>
    </div>

    <!-- Forms List Container -->
    <div class="space-y-6">
        <template x-for="(form, index) in addForms" :key="form._id || index">
            <div class="relative bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-200 focus-within:z-20 hover:z-10">
                
                <!-- Card Header -->
                <div class="px-5 py-3.5 bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center rounded-t-xl">
                    <div class="flex items-center gap-2.5">
                        <span class="w-6 h-6 rounded-full bg-blue-600 dark:bg-blue-500 text-white font-bold text-xs flex items-center justify-center shadow-xs" x-text="index + 1"></span>
                        <h2 class="text-sm font-bold text-gray-900 dark:text-white" x-text="`Form Timesheet #${index + 1}`"></h2>
                    </div>

                    <!-- Card Actions: Duplicate & Remove -->
                    <div class="flex items-center gap-1">
                        <!-- Duplicate Button -->
                        <button @click="duplicateForm(index)" type="button" title="Duplikasi form ini"
                            class="p-1.5 rounded-lg text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-gray-700 text-xs flex items-center gap-1 transition cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" /></svg>
                            <span class="hidden sm:inline">Salin</span>
                        </button>

                        <!-- Remove Button -->
                        <template x-if="addForms.length > 1">
                            <button @click="removeForm(index)" type="button" title="Hapus form ini"
                                class="p-1.5 rounded-lg text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 hover:bg-red-50 dark:hover:bg-red-900/30 text-xs flex items-center gap-1 transition cursor-pointer">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                <span class="hidden sm:inline">Hapus</span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Card Body Form Fields -->
                <div class="p-5 sm:p-6 space-y-5">
                    
                    <!-- Chunking Information Banner -->
                    <div class="bg-blue-50/70 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 rounded-lg p-3.5 flex flex-col gap-2">
                        <div class="flex items-start gap-2.5">
                            <svg class="w-4 h-4 text-blue-600 dark:text-blue-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <div class="text-xs text-blue-900 dark:text-blue-200 leading-relaxed">
                                <span class="font-bold">Automated Chunking:</span>
                                Rentang jam kerja (<span class="font-mono font-semibold" x-text="form.begin || workConfig.startTime"></span> – <span class="font-mono font-semibold" x-text="form.end || workConfig.endTime"></span>) akan otomatis dipecah per interval preset, melewati jam istirahat siang (<span class="font-mono font-semibold" x-text="workConfig.lunchStart"></span> – <span class="font-mono font-semibold" x-text="workConfig.lunchEnd"></span>). Maksimal 4 jam per chunk.
                            </div>
                        </div>

                        <!-- Generated Slots Badges -->
                        <template x-if="getFormSlots(form).length > 0">
                            <div class="text-xs text-blue-900 dark:text-blue-300 flex flex-wrap items-center gap-1.5 pt-1">
                                <span class="font-semibold text-blue-800 dark:text-blue-200">Slot yang akan dibuat:</span>
                                <template x-for="slot in getFormSlots(form)" :key="slot">
                                    <span class="bg-white dark:bg-blue-900/80 text-blue-700 dark:text-blue-200 px-2 py-0.5 rounded text-[11px] font-mono border border-blue-300 dark:border-blue-700 shadow-2xs" x-text="slot"></span>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- Row 1: Duration Preset, Date, Start Time, End Time -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                        <!-- Duration Preset -->
                        <div>
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Duration Preset <span class="text-red-500">*</span>
                            </label>
                            <select x-model="form.durationPreset" @change="onFormPresetChange(form)"
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition cursor-pointer">
                                <template x-for="p in durationPresets" :key="p.value">
                                    <option :value="p.value" x-text="p.label"></option>
                                </template>
                            </select>
                        </div>

                        <!-- Date -->
                        <div>
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Tanggal <span class="text-red-500">*</span>
                            </label>
                            <input type="date" x-model="form.date" 
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- Start Time -->
                        <div>
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Waktu Mulai <span class="text-red-500">*</span>
                            </label>
                            <input type="time" x-model="form.begin" @change="onFormBeginChange(form)"
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>

                        <!-- End Time -->
                        <div>
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Waktu Selesai <span class="text-red-500">*</span>
                            </label>
                            <input type="time" x-model="form.end" 
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>
                    </div>

                    <!-- Row 2: Customer, Project, Activity -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        
                        <!-- Customer Dropdown (Searchable) -->
                        <div x-data="searchSelect()" @click.away="close()" class="relative" :class="open ? 'z-30' : 'z-10'">
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Customer
                            </label>
                            <div @click="toggle()" 
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm rounded-lg w-full p-2.5 flex justify-between items-center cursor-pointer transition focus-within:ring-2 focus-within:ring-blue-500">
                                <span class="truncate" x-text="getSelectedName(customers, form.customer, 'Pilih Customer...')" 
                                    :class="isSelected(form.customer) ? 'text-gray-900 dark:text-white' : 'text-gray-400 dark:text-gray-400'"></span>
                                <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                            </div>
                            
                            <!-- Dropdown Menu -->
                            <div x-show="open" x-cloak x-transition class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-hidden">
                                <div class="p-2 border-b border-gray-200 dark:border-gray-600">
                                    <input x-ref="searchInput" type="text" x-model="search" placeholder="Cari customer..."
                                        class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                </div>
                                <ul class="max-h-48 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600">
                                    <li @click="form.customer = ''; close()" class="px-3.5 py-2 hover:bg-gray-100 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-500 dark:text-gray-400 italic">
                                        (Kosongkan pilihan)
                                    </li>
                                    <template x-for="item in filterList(customers)" :key="item.id">
                                        <li @click="form.customer = item.id; close()" 
                                            class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors"
                                            :class="String(form.customer) === String(item.id) ? 'font-bold bg-blue-50/50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300' : ''"
                                            x-text="item.name"></li>
                                    </template>
                                    <li x-show="filterList(customers).length === 0" class="px-4 py-3 text-xs text-gray-400 text-center">
                                        Tidak ditemukan
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- Project Dropdown (Searchable) -->
                        <div x-data="searchSelect()" @click.away="close()" class="relative" :class="open ? 'z-30' : 'z-10'">
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Project <span class="text-red-500">*</span>
                            </label>
                            <div @click="toggle()" 
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm rounded-lg w-full p-2.5 flex justify-between items-center cursor-pointer transition focus-within:ring-2 focus-within:ring-blue-500">
                                <span class="truncate" x-text="getSelectedName(projects, form.project, 'Pilih Project...')" 
                                    :class="isSelected(form.project) ? 'text-gray-900 dark:text-white font-medium' : 'text-gray-400 dark:text-gray-400'"></span>
                                <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                            </div>
                            
                            <!-- Dropdown Menu -->
                            <div x-show="open" x-cloak x-transition class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-hidden">
                                <div class="p-2 border-b border-gray-200 dark:border-gray-600">
                                    <input x-ref="searchInput" type="text" x-model="search" placeholder="Cari project..."
                                        class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                </div>
                                <ul class="max-h-48 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600">
                                    <template x-for="item in filterList(projects)" :key="item.id">
                                        <li @click="form.project = item.id; close()" 
                                            class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors"
                                            :class="String(form.project) === String(item.id) ? 'font-bold bg-blue-50/50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300' : ''"
                                            x-text="item.name"></li>
                                    </template>
                                    <li x-show="filterList(projects).length === 0" class="px-4 py-3 text-xs text-gray-400 text-center">
                                        Tidak ditemukan
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- Activity Dropdown (Searchable) -->
                        <div x-data="searchSelect()" @click.away="close()" class="relative" :class="open ? 'z-30' : 'z-10'">
                            <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                                Activity <span class="text-red-500">*</span>
                            </label>
                            <div @click="toggle()" 
                                class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm rounded-lg w-full p-2.5 flex justify-between items-center cursor-pointer transition focus-within:ring-2 focus-within:ring-blue-500">
                                <span class="truncate" x-text="getSelectedName(activities, form.activity, 'Pilih Activity...')" 
                                    :class="isSelected(form.activity) ? 'text-gray-900 dark:text-white font-medium' : 'text-gray-400 dark:text-gray-400'"></span>
                                <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                            </div>
                            
                            <!-- Dropdown Menu -->
                            <div x-show="open" x-cloak x-transition class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-hidden">
                                <div class="p-2 border-b border-gray-200 dark:border-gray-600">
                                    <input x-ref="searchInput" type="text" x-model="search" placeholder="Cari activity..."
                                        class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                </div>
                                <ul class="max-h-48 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600">
                                    <template x-for="item in filterList(activities)" :key="item.id">
                                        <li @click="form.activity = item.id; close()" 
                                            class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors"
                                            :class="String(form.activity) === String(item.id) ? 'font-bold bg-blue-50/50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300' : ''"
                                            x-text="item.name"></li>
                                    </template>
                                    <li x-show="filterList(activities).length === 0" class="px-4 py-3 text-xs text-gray-400 text-center">
                                        Tidak ditemukan
                                    </li>
                                </ul>
                            </div>
                        </div>

                    </div>

                    <!-- Row 3: Description -->
                    <div>
                        <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                            Description <span class="text-red-500">*</span>
                        </label>
                        <textarea x-model="form.description" rows="2" 
                            class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" 
                            placeholder="Tuliskan deskripsi pekerjaan..."></textarea>
                    </div>

                    <!-- Row 4: Tags Input -->
                    <div x-data="tagInput()" @click.away="open = false" class="relative" :class="open ? 'z-30' : 'z-10'">
                        <label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">
                            Tags
                        </label>
                        <div @click="open = true; $nextTick(() => $refs.tagSearchInput?.focus())" 
                            class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg w-full p-1.5 min-h-[42px] flex flex-wrap gap-1.5 items-center cursor-text transition focus-within:ring-2 focus-within:ring-blue-500">
                            
                            <!-- Selected Tags Chips -->
                            <template x-for="tag in form.tags" :key="tag">
                                <span class="bg-blue-50 dark:bg-blue-900/60 text-blue-700 dark:text-blue-200 text-xs font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 border border-blue-200 dark:border-blue-700">
                                    <span x-text="tag"></span>
                                    <button type="button" @click.stop="removeTag(form.tags, tag)" class="hover:text-red-600 dark:hover:text-red-400 focus:outline-none">&times;</button>
                                </span>
                            </template>
                            
                            <!-- Search Input -->
                            <input x-ref="tagSearchInput" type="text" x-model="search" 
                                @keydown="handleKeydown($event, form.tags, availableTags)" 
                                @focus="open = true" 
                                class="bg-transparent border-none outline-none text-xs text-gray-900 dark:text-white flex-grow min-w-[70px] p-1 focus:ring-0" 
                                placeholder="Ketik tag lalu tekan enter...">
                        </div>

                        <!-- Tags Autocomplete Dropdown -->
                        <div x-show="open && (getFilteredTags(availableTags, form.tags).length > 0 || search.trim() !== '')" 
                            x-cloak x-transition 
                            class="absolute left-0 right-0 z-50 w-full mt-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg shadow-2xl overflow-y-auto max-h-48 divide-y divide-gray-100 dark:divide-gray-600">
                            <ul>
                                <template x-for="item in getFilteredTags(availableTags, form.tags)" :key="item">
                                    <li @click="addTag(form.tags, item)" 
                                        class="px-3.5 py-2 hover:bg-blue-50 dark:hover:bg-blue-600 cursor-pointer text-xs text-gray-800 dark:text-gray-200 transition-colors" 
                                        x-text="item"></li>
                                </template>
                                <li x-show="getFilteredTags(availableTags, form.tags).length === 0 && search.trim() !== ''" 
                                    @click="addTag(form.tags, search.trim())" 
                                    class="px-3.5 py-2 hover:bg-emerald-50 dark:hover:bg-emerald-700 cursor-pointer text-xs text-emerald-700 dark:text-emerald-200 font-medium">
                                    + Tambahkan tag baru: "<span x-text="search"></span>"
                                </li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </template>
    </div>

    <!-- Bottom Actions Toolbar (Sticky) -->
    <div class="sticky bottom-4 z-40 mt-8 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
        <!-- Summary Info -->
        <div class="text-xs text-gray-600 dark:text-gray-300 text-center sm:text-left">
            <span>Total: </span>
            <span class="font-bold text-gray-900 dark:text-white" x-text="addForms.length"></span> form
            <span class="text-gray-400 mx-1">|</span>
            <span>Estimasi chunk record: </span>
            <span class="font-bold text-blue-600 dark:text-blue-400" x-text="getTotalEstimatedChunks()"></span> chunk
        </div>

        <!-- Buttons -->
        <div class="flex items-center gap-2.5 w-full sm:w-auto justify-end">
            <!-- Add Another Button -->
            <button @click="addAnotherForm" type="button" :disabled="isSubmittingAdd"
                class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition cursor-pointer flex items-center justify-center gap-1.5 disabled:opacity-50">
                <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                <span>Add Another</span>
            </button>

            <!-- Cancel Button -->
            <button @click="navigate('')" type="button" :disabled="isSubmittingAdd"
                class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition cursor-pointer disabled:opacity-50">
                Cancel
            </button>

            <!-- Submit Button -->
            <button @click="submitAllForms" type="button" :disabled="isSubmittingAdd"
                class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-6 py-2.5 transition shadow-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                <template x-if="isSubmittingAdd">
