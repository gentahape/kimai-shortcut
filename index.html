<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimai Shortcut</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="/favicon.ico">
    <script type="module" src="/src/main.js"></script>
</head>

<body class="bg-slate-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen flex flex-col antialiased transition-colors duration-200" x-data="kimaiApp()">

    <div x-html="await loadPartial('/partials/navbar.html')"></div>

    <div x-cloak x-show="currentRoute.view === 'list'" x-html="await loadPartial('/partials/listView.html')" class="flex-grow flex flex-col"></div>
    <div x-cloak x-show="currentRoute.view === 'add'" x-html="await loadPartial('/partials/addView.html')" class="flex-grow flex flex-col"></div>
    <div x-cloak x-show="currentRoute.view === 'edit'" x-html="await loadPartial('/partials/editView.html')" class="flex-grow flex flex-col"></div>

    <div x-html="await loadPartial('/partials/footer.html')"></div>

</body>
</html>
