<main class="w-full container mx-auto px-6 py-8">
    <div :class="isAuthenticated ? '' : 'opacity-50 pointer-events-none'" class="bg-gray-800 rounded-lg shadow-lg border border-gray-700 p-6 transition duration-300">
        
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 space-y-4 sm:space-y-0">
            <div class="relative w-full sm:w-72 text-gray-400">
                <svg class="w-5 h-5 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" x-model="searchQuery" placeholder="Search..." 
                    class="w-full bg-gray-900 border border-gray-600 text-white text-sm rounded-lg pl-10 pr-4 py-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors shadow-inner">
            </div>

            <button @click="openModal" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition duration-200 flex justify-center items-center gap-2 shadow-lg cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                CREATE
            </button>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-700">
            <table class="w-full text-left text-sm text-gray-300 whitespace-nowrap">
                <thead class="bg-gray-900 text-gray-100 uppercase text-xs font-semibold">
                    <tr>
                        <th class="py-3 px-4 w-12 text-center">NO</th>
                        <th class="py-3 px-4">DATE</th>
                        <th class="py-3 px-4">BEGIN</th>
                        <th class="py-3 px-4">END</th>
                        <th class="py-3 px-4">ACTIVITY</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <template x-for="(row, index) in paginatedTimesheets" :key="row.id || index">
                        <tr class="hover:bg-gray-750 transition-colors">
                            <td class="py-3 px-4 text-center font-medium" x-text="(currentPage - 1) * itemsPerPage + index + 1"></td>
                            <td class="py-3 px-4" x-text="row.begin ? row.begin.substring(0, 10) : '-'"></td>
                            <td class="py-3 px-4" x-text="row.begin ? row.begin.substring(11, 16) : '-'"></td>
                            <td class="py-3 px-4" x-text="row.end ? row.end.substring(11, 16) : '-'"></td>
                            <td class="py-3 px-4 min-w-[200px] whitespace-normal">
                                <div x-text="row.description || '-'"></div>
                                <template x-if="row.tags && row.tags.length > 0">
                                    <div class="mt-1.5 flex flex-wrap gap-1">
                                        <template x-for="tag in row.tags" :key="tag">
                                            <span class="inline-block bg-blue-900 text-blue-200 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-blue-700" x-text="tag"></span>
                                        </template>
                                    </div>
                                </template>
                            </td>
                        </tr>
                    </template>
                    
                    <tr x-show="paginatedTimesheets.length === 0">
                        <td colspan="7" class="py-8 text-center text-gray-500">
                            No timesheets found
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex flex-col sm:flex-row justify-between items-center mt-6 space-y-4 sm:space-y-0" x-show="filteredTimesheets.length > 0">
            <div class="text-sm text-gray-400">
                Menampilkan <span class="font-bold text-white" x-text="((currentPage - 1) * itemsPerPage) + 1"></span>
                sampai <span class="font-bold text-white" x-text="Math.min(currentPage * itemsPerPage, filteredTimesheets.length)"></span>
                dari <span class="font-bold text-white" x-text="filteredTimesheets.length"></span> entri
            </div>
            
            <div class="inline-flex space-x-1 shadow-sm rounded-lg overflow-hidden border border-gray-600 bg-gray-700 p-0.5">
                <button @click="prevPage()" :disabled="currentPage === 1" 
                    class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-gray-300 hover:bg-gray-600 hover:text-white">
                    Prev
                </button>
                
                <template x-for="page in visiblePages" :key="page">
                    <button @click="goToPage(page)" x-text="page"
                        :class="page === currentPage ? 'bg-blue-600 text-white' : 'text-gray-300 hover:bg-gray-600 hover:text-white'"
                        class="px-3.5 py-1.5 text-sm font-medium rounded-md transition-colors">
                    </button>
                </template>

                <button @click="nextPage()" :disabled="currentPage === totalPages" 
                    class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-gray-300 hover:bg-gray-600 hover:text-white">
                    Next
                </button>
            </div>
        </div>

    </div>
</main>
